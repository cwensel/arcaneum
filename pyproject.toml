[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcaneum"
version = "0.9.0"
description = "CLI tools for semantic and full-text search with Qdrant and MeiliSearch"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Arcaneum Team"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = [
    "semantic-search",
    "full-text-search",
    "qdrant",
    "meilisearch",
    "vector-database",
    "embeddings",
    "claude-code",
    "ai-tools",
    "pdf-indexing",
    "code-indexing",
]

dependencies = [
    "click>=8.3.0",
    "qdrant-client>=1.18.0",
    "fastembed>=0.8.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "pydantic>=2.12.3",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
    "psutil>=6.1.0",  # CPU monitoring (RDR-013 Phase 1)
    "xxhash>=3.5.0",  # Fast non-cryptographic hashing for file deduplication
    # PDF indexing dependencies (RDR-004, RDR-016)
    "pymupdf>=1.28.0",
    "pymupdf4llm>=1.28.0",  # Auto-OCR for garbled text (>90% unreadable chars triggers Tesseract)
    "pymupdf-layout>=1.28.0",  # Auto-initialized by pymupdf4llm for layout detection
    "pdfplumber>=0.11.7",
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "opencv-python-headless>=4.10.0,<5",  # 5.x untested in OCR preprocessing path
    "Pillow>=10.0.0",  # Direct use in OCR image pipeline
    # Source code indexing dependencies (RDR-005)
    # tree-sitter 0.26 and language-pack 1.14 segfault on large Python ASTs on Linux.
    "tree-sitter>=0.25.2,<0.26.0",
    # 1.6.3 dropped the direct tree-sitter dependency; 1.8 switched to
    # method-based bindings, which ast_extractor supports.
    "tree-sitter-language-pack>=1.8.1,<1.14.0",
    "llama-index-core>=0.14.6",
    "GitPython>=3.1.45",
    # Markdown indexing dependencies (RDR-014)
    "markdown-it-py>=4.0.0",
    # Transparent .md.zst reads (stdlib compression.zstd needs Python 3.14+)
    "zstandard>=0.23.0",
    "python-frontmatter>=1.1.0",
    "pygments>=2.19.0",
    # SOCKS proxy support for httpx (required when running in Claude Code sandbox)
    "socksio>=1.0.0",
    # Direct HTTP use (Docker daemon check in cli/docker.py)
    "requests>=2.32.0",
    # Collection export/import (RDR-017)
    "msgpack>=1.1.0",
    "numpy>=1.26.0",
    # Full-text search (RDR-008)
    "meilisearch>=0.43.0",
    # Embedding inference engine used by fastembed; pinned directly for CPU perf gains
    "onnxruntime>=1.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "jsonschema[format]>=4.23.0,<5.0",
    "black>=25.9.0",
    "build>=1.3.0",
    "pip-audit>=2.9.0",
    "ruff>=0.14.2",
    "twine>=6.2.0",
    "wheel>=0.45.0",
]
benchmarks = [
    "jsonschema[format]>=4.23.0,<5.0",
]
ocr = [
    "easyocr>=1.7.2",
]
sentence-transformers = [
    "sentence-transformers>=5.5.1",
    # 4.56+ required for EmbeddingGemma (gemma-embed); 4.51+ for the qwen3
    # architecture (qwen3-embed); 4.54+ needs the DynamicCache shim in
    # embeddings/client.py; 5.x breaks Stella's pinned remote code entirely
    # (see docs/DEPENDENCY_NOTES.md)
    "transformers>=4.56.0,<5.0",
    "torch>=2.12.0",
]
large-models = [
    "sentence-transformers>=5.5.1",
    # 4.56+ required for EmbeddingGemma (gemma-embed); 4.51+ for the qwen3
    # architecture (qwen3-embed); 4.54+ needs the DynamicCache shim in
    # embeddings/client.py; 5.x breaks Stella's pinned remote code entirely
    # (see docs/DEPENDENCY_NOTES.md)
    "transformers>=4.56.0,<5.0",
    "torch>=2.12.0",
]

[project.scripts]
arc = "arcaneum.cli.main:main"

[project.urls]
Homepage = "https://github.com/cwensel/arcaneum"
Repository = "https://github.com/cwensel/arcaneum"
Documentation = "https://github.com/cwensel/arcaneum#readme"
Issues = "https://github.com/cwensel/arcaneum/issues"
Changelog = "https://github.com/cwensel/arcaneum/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arcaneum = ["embeddings/*.json", "benchmarks/schemas/*.json"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require services)",
    "e2e: End-to-end tests",
    "gpu_smoke: Opt-in accelerator smoke tests for CUDA/MPS embedding paths",
    "accelerator: Opt-in hardware-specific accelerator benchmarks",
    "slow: Tests taking >5 seconds",
    "rdr_spec: Executable RDR specifications; red until their RDR is implemented",
]
# `rdr_spec` tests are the red half of a red/green cycle: they pin an RDR's
# invariants before the implementation exists and are expected to fail (often
# at import). Deselected by default so they do not break collection; run them
# with `-m rdr_spec` to check an RDR's status.
addopts = "-v --tb=short -m 'not rdr_spec'"

[tool.coverage.run]
source = ["src/arcaneum"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
